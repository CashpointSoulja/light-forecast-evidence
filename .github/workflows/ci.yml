name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:fixtures
      - run: npm test
      - run: npm run eval
      - name: Broken rule must fail
        run: "! npm run eval:broken"
      - name: Workers dry run (no deploy)
        run: npm run check:deploy
